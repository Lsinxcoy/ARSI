tasks:
  - id: code_fix_001
    category: code_repair
    verifier_rung: 1
    prompt: "修复 sum_first_n 函数中的 off-by-one 错误，使其计算 1 到 n 的和"
    expected_behavior: "sum_first_n(3)==6 and sum_first_n(5)==15"
    timeout: 60

  - id: code_fix_002
    category: code_repair
    verifier_rung: 1
    prompt: "修复 average 函数，空列表返回 0.0 不抛异常"
    expected_behavior: "average([])==0.0 and average([1,2,3])==2.0"
    timeout: 60

  - id: code_fix_003
    category: code_repair
    verifier_rung: 1
    prompt: "修复 factorial 函数的无限递归，使其正确计算阶乘"
    expected_behavior: "factorial(5)==120 and factorial(0)==1"
    timeout: 60

  - id: code_fix_004
    category: code_repair
    verifier_rung: 1
    prompt: "实现 fibonacci 函数，返回第 n 个斐波那契数（fib(0)=0, fib(1)=1）"
    expected_behavior: "fibonacci(0)==0 and fibonacci(1)==1 and fibonacci(10)==55"
    timeout: 60

  - id: code_fix_005
    category: code_repair
    verifier_rung: 1
    prompt: "实现 is_palindrome 函数，判断字符串是否为回文（忽略大小写）"
    expected_behavior: "is_palindrome('Racecar')==True and is_palindrome('hello')==False"
    timeout: 60

  - id: code_fix_006
    category: code_repair
    verifier_rung: 1
    prompt: "实现 reverse_string 函数，反转字符串"
    expected_behavior: "reverse_string('abc')=='cba' and reverse_string('')=='"
    timeout: 60

  - id: reasoning_001
    category: knowledge_reasoning
    verifier_rung: 1
    prompt: "解释为什么快速排序最坏时间复杂度是 O(n²)，要求提到 pivot 和递归深度"
    expected_keywords: ["pivot", "递归", "最坏"]
    scoring: keyword_match
    timeout: 60

  - id: reasoning_002
    category: knowledge_reasoning
    verifier_rung: 1
    prompt: "什么是 CAP 定理？三个属性分别是什么？"
    expected_keywords: ["一致性", "可用性", "分区容错"]
    scoring: keyword_match
    timeout: 60

  - id: reasoning_003
    category: knowledge_reasoning
    verifier_rung: 1
    prompt: "解释 TCP 三次握手的过程，以及为什么需要三次而不是两次"
    expected_keywords: ["SYN", "ACK", "三次", "握手"]
    scoring: keyword_match
    timeout: 60

  - id: reasoning_004
    category: knowledge_reasoning
    verifier_rung: 1
    prompt: "什么是数据库索引？为什么 B+ 树比二叉搜索树更适合数据库索引？"
    expected_keywords: ["索引", "B+树", "平衡", "磁盘"]
    scoring: keyword_match
    timeout: 60

  - id: reasoning_005
    category: knowledge_reasoning
    verifier_rung: 1
    prompt: "解释什么是死锁，以及预防死锁的四个必要条件"
    expected_keywords: ["互斥", "占有", "等待", "循环"]
    scoring: keyword_match
    timeout: 60

  - id: reasoning_006
    category: knowledge_reasoning
    verifier_rung: 1
    prompt: "什么是负载均衡？列举至少两种负载均衡算法"
    expected_keywords: ["负载均衡", "轮询", "权重"]
    scoring: keyword_match
    timeout: 60

  - id: reproduce_001
    category: paper_reproduction
    verifier_rung: 3
    prompt: "计算数据集 [2,4,6,8,10] 的均值、总体标准差、中位数。输出格式: mean=X, std=Y, median=Z"
    expected_values:
      mean: 6.00
      std: 2.83
      median: 6.00
    tolerance: 0.1
    timeout: 60

  - id: reproduce_002
    category: paper_reproduction
    verifier_rung: 3
    prompt: "计算数据集 [1,3,5,7,9,11] 的均值和极差（max-min）。输出格式: mean=X, range=Y"
    expected_values:
      mean: 6.00
      range: 10.00
    tolerance: 0.1
    timeout: 60

  - id: reproduce_003
    category: paper_reproduction
    verifier_rung: 3
    prompt: "计算 2 的 10 次方和 3 的 5 次方。输出格式: pow2=X, pow3=Y"
    expected_values:
      pow2: 1024.00
      pow3: 243.00
    tolerance: 0.5
    timeout: 60
