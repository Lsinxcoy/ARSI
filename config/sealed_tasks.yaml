tasks:
  - id: code_fix_001
    category: code_repair
    verifier_rung: 1
    prompt: "修复 sum_first_n 函数中的 off-by-one 错误，使其计算 1 到 n 的和"
    expected_behavior: "sum_first_n(3)==6 and sum_first_n(5)==15"
    timeout: 60

  - id: code_fix_002
    category: code_repair
    verifier_rung: 1
    prompt: "修复 average 函数，空列表返回 0.0 不抛异常"
    expected_behavior: "average([])==0.0 and average([1,2,3])==2.0"
    timeout: 60

  - id: reasoning_001
    category: knowledge_reasoning
    verifier_rung: 1
    prompt: "解释为什么快速排序最坏时间复杂度是 O(n²)，要求提到 pivot 和递归深度"
    expected_keywords: ["pivot", "递归", "最坏"]
    scoring: keyword_match
    timeout: 60

  - id: reasoning_002
    category: knowledge_reasoning
    verifier_rung: 1
    prompt: "什么是 CAP 定理？三个属性分别是什么？"
    expected_keywords: ["一致性", "可用性", "分区容错"]
    scoring: keyword_match
    timeout: 60

  - id: reproduce_001
    category: paper_reproduction
    verifier_rung: 3
    prompt: "计算数据集 [2,4,6,8,10] 的均值、总体标准差、中位数。输出格式: mean=X, std=Y, median=Z"
    expected_values:
      mean: 6.00
      std: 2.83
      median: 6.00
    tolerance: 0.1
    timeout: 60
